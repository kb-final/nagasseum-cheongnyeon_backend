# 공통 설정 (환경별로 바뀌지 않는 값)
# 민감값/환경별 값은 여기 두지 않고 환경변수로 주입한다.
#   DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST, REDIS_PORT
#   → 로컬은 RootConfig의 기본값 사용, 서버는 .env → 컨테이너 환경변수

app.name=independence-backend
app.timezone=Asia/Seoul

molit.api.key=${MOLIT_SERVICE_KEY}

# JWT
jwt.secret=${JWT_SECRET:local-dev-secret-key-must-be-32-chars!!}
jwt.access-token-validity-ms=1800000
jwt.refresh-token-validity-ms=1209600000

# Kakao OAuth
kakao.client.id=${KAKAO_REST_API_KEY:local-dev-client-id}
kakao.client.secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect.uri=${KAKAO_REDIRECT_URI:http://localhost:5173/callback}

# 온통청년 정책 API
youth.api.base-url=https://www.youthcenter.go.kr/go/ythip
youth.api.key=${POLICY_API_KEY:}
youth.api.page-size=100

# Slack (배치 실패 알림)
slack.webhook.url=${SLACK_WEBHOOK_URL:}
