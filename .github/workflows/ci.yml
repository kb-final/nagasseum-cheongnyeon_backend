name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 단위 테스트
        run: mvn -B test

      - name: 테스트 결과 리포트
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 단위 테스트 결과
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 빌드
        run: mvn -B clean package -DskipTests

      - name: WAR 생성 확인
        run: |
          if [ ! -f target/independence-backend.war ]; then
            echo "❌ WAR 파일이 생성되지 않았습니다"
            exit 1
          fi
          echo "✅ 빌드 성공: $(ls -lh target/independence-backend.war | awk '{print $5}')"
